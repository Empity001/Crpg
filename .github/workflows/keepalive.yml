name: Mantener Supabase despierto

# El plan gratuito de Supabase pausa el proyecto si en una semana no recibe suficiente
# actividad (su documentación habla de unas pocas consultas al día) y la web se queda
# sin datos sin que nadie se entere. Este workflow hace tres consultas ligeras cada 6
# horas. Si el proyecto ya estuviera pausado, fallan y GitHub avisa por correo. La URL
# y la clave son las públicas de js/config.js.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# GitHub desactiva los workflows programados de un repo público tras 60 días sin
# commits. El último paso vuelve a habilitar este mismo workflow en cada ejecución
# para reiniciar ese contador y que el aviso no se apague solo.
permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultas ligeras a la API
        env:
          SUPABASE_URL: https://pmswpieenktwtlwveqym.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_uu2k-Gd6jDorHSK4m_ua0w_W9W47ZoP
        run: |
          for consulta in \
            "site_content_versions?select=section&limit=1" \
            "categories?select=*&limit=1" \
            "tierlist_rows?select=*&limit=1"; do
            curl --fail --silent --show-error --max-time 30 \
              "$SUPABASE_URL/rest/v1/$consulta" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -o /dev/null
          done
          echo "Supabase respondió correctamente."

      - name: Mantener activo este workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keepalive.yml/enable"
