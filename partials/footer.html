<!-- ============ MODAL: LOGIN DE ADMIN ============ -->
<!-- Presente en todas las páginas: el botón ADMIN del header vive en
     el partial de header, así que este modal debe estar disponible
     sin importar en qué página esté el usuario. -->
<div class="modal-overlay hidden" id="admin-modal">
  <div class="modal-box">
    <button class="modal-close" id="close-admin-modal" aria-label="Cerrar">✕</button>
    <h3 class="modal-title">🔐 ACCESO DE ADMINISTRADOR</h3>
    <p class="modal-hint">Solicita el código de 24h al bot de Discord con <code>/getcode</code> e ingrésalo aquí.</p>
    <input type="text" id="admin-code-input" class="modal-input" placeholder="CÓDIGO-DE-6-DÍGITOS" maxlength="32" autocomplete="off" />
    <div class="modal-error hidden" id="admin-modal-error"></div>
    <button class="btn-primary" id="submit-admin-code">Validar código</button>
  </div>
</div>

<!-- ============ TOASTS ============ -->
<div class="toast-container" id="toast-container"></div>
