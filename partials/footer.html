<!-- ============ MODAL: CUENTA DE DISCORD ============ -->
<div class="modal-overlay hidden" id="admin-modal">
  <div class="modal-box discord-account-modal" role="dialog" aria-modal="true" aria-labelledby="admin-login-title">
    <button class="modal-close" id="close-admin-modal" aria-label="Cerrar">✕</button>
    <span class="discord-account-eyebrow">Cuenta y administración</span>
    <h3 class="modal-title" id="admin-login-title">Tu cuenta de Discord</h3>
    <p class="discord-account-intro">Conecta tu cuenta para mostrar tu identidad en la página. El modo administrador solo aparece si conservas el rol configurado en el servidor.</p>

    <div class="discord-account-card">
      <div class="discord-account-avatar-wrap">
        <img id="discord-account-avatar" class="discord-account-avatar hidden" alt="Avatar de Discord" />
        <span class="discord-account-avatar-fallback" aria-hidden="true">◆</span>
      </div>
      <div class="discord-account-copy">
        <strong id="discord-account-name">Discord no conectado</strong>
        <span id="discord-account-status">Conecta tu cuenta para identificarte en la página.</span>
      </div>
    </div>

    <div class="discord-account-actions">
      <button class="btn-primary" id="discord-login-btn" type="button">Iniciar sesión con Discord</button>
      <button class="btn-primary hidden" id="discord-admin-mode-btn" type="button">Activar modo administrador</button>
      <button class="btn-secondary hidden" id="discord-logout-btn" type="button">Cerrar sesión</button>
    </div>
    <div class="modal-error hidden" id="discord-auth-error"></div>
  </div>
</div>

<!-- ============ TOASTS ============ -->
<div class="toast-container" id="toast-container"></div>
