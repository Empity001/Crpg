<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>culones-rpg · Vista de imagen</title>
<style>
  :root {
    color-scheme: dark;
    --theme-page-bg: #070914;
    --theme-sidebar-bg: #0b0e1d;
    --theme-panel-bg: #111528;
    --theme-primary: #8b3dff;
    --theme-primary-soft: #b46cff;
    --btn-secondary-bg: #171b32;
    --btn-secondary-bg-hover: #27214a;
    --btn-secondary-text: #f5f3ff;
    --btn-secondary-border: rgba(133,112,191,.34);
    --btn-secondary-border-hover: rgba(139,61,255,.62);
    --theme-link: #38bdf8;
    --theme-link-hover: #9ee8ff;
    --theme-danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background:
      radial-gradient(circle at 70% 0%, color-mix(in srgb, var(--theme-primary) 16%, transparent), transparent 38%),
      var(--theme-page-bg);
    font-family: 'Space Grotesk', Arial, sans-serif;
  }
  .bar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    background: color-mix(in srgb, var(--theme-sidebar-bg) 92%, transparent);
    border-bottom: 1px solid var(--btn-secondary-border);
    backdrop-filter: blur(18px);
    z-index: 10;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--btn-secondary-bg);
    border: 1px solid var(--btn-secondary-border);
    color: var(--btn-secondary-text);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 11px;
    cursor: pointer;
    text-decoration: none;
  }
  .back-btn:hover { border-color: var(--btn-secondary-border-hover); color: var(--btn-secondary-text); background: var(--btn-secondary-bg-hover); }
  .asset-title {
    color: var(--ink-400, #aaa6c5);
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 84px 16px 24px;
  }
  .stage img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 18px;
    box-shadow: 0 28px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(133,112,191,.22);
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  .error-msg {
    color: var(--theme-danger);
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="bar">
    <button class="back-btn" id="back-btn">← Volver</button>
    <span class="asset-title" id="asset-title"></span>
  </div>
  <div class="stage" id="stage">
    <p class="error-msg" id="error-msg" style="display:none;">No se pudo cargar la imagen.</p>
    <img id="asset-img" alt="Vista completa" style="display:none;" />
  </div>

  <script type="module">
    import { supabaseClient } from './js/config.js';
    import { applyThemeConfig, getLocalThemeOverride, normalizeThemeConfig } from './js/features/theme.js?v=20260711-02';

    const localTheme = getLocalThemeOverride();
    if (localTheme) {
      applyThemeConfig(localTheme);
    } else {
      try {
        const { data } = await supabaseClient
          .from('app_settings')
          .select('value')
          .eq('key', 'theme_config')
          .maybeSingle();
        applyThemeConfig(normalizeThemeConfig(data?.value || {}));
      } catch (error) {
        applyThemeConfig(normalizeThemeConfig({}));
      }
    }
  </script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get('src') || '';
    const title = params.get('title') || '';

    document.getElementById('asset-title').textContent = title;

    const img = document.getElementById('asset-img');
    const errorMsg = document.getElementById('error-msg');

    if (src) {
      img.src = src;
      img.style.display = 'block';
      img.onerror = () => {
        img.style.display = 'none';
        errorMsg.style.display = 'block';
      };
    } else {
      errorMsg.textContent = 'No se especificó ninguna imagen.';
      errorMsg.style.display = 'block';
    }

    document.getElementById('back-btn').addEventListener('click', () => {
      // Esta pestaña se abrió desde el sitio principal con un botón
      // de "ver en pantalla completa" — al volver, simplemente
      // cerramos esta pestaña y el usuario regresa a la pestaña
      // original. Si el navegador no permite cerrarla (porque no
      // fue abierta por script, p. ej. el usuario la abrió manual),
      // probamos history.back() como respaldo.
      window.close();
      setTimeout(() => { if (!window.closed) history.back(); }, 150);
    });
  </script>
</body>
</html>
