<script>
  // GitHub Pages sirve este archivo en cualquier ruta que no exista, a
  // cualquier profundidad. Se fija la base para que estilos y enlaces
  // carguen siempre desde la raíz del sitio (/Crpg/ en github.io, / en un dominio propio).
  (function () {
    var first = location.pathname.split('/')[1] || '';
    var onProjectPages = location.hostname.slice(-10) === '.github.io' && first !== '';
    document.write('<base href="' + (onProjectPages ? '/' + first + '/' : '/') + '">');
  })();
</script>
