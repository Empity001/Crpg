<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Empi Network</title>
  <link rel="icon" href="assets/network/empi-mark.png" />
  <link rel="stylesheet" href="css/network.css?v=20260729-5" />
  <link rel="stylesheet" href="css/network-builder.css?v=20260729-5" />
</head>
<body class="network-page instance-page">
  <a class="skip-link" href="#instance-main">Saltar al contenido</a>
  <header class="instance-header" id="instance-header">
    <a class="network-brand" href="index.html"><img src="assets/network/empi-mark.png" alt="" /><span>Empi Network</span></a>
    <span id="instance-nav-anchor" hidden></span>
    <nav class="instance-nav" id="instance-nav" aria-label="Secciones"></nav>
    <button class="instance-nav-toggle hidden" id="instance-nav-toggle" type="button" aria-expanded="false" aria-controls="instance-nav">Menú</button>
    <span id="instance-search-anchor" hidden></span>
    <button class="instance-search-button hidden" id="instance-search-button" type="button">Buscar</button>
  </header>
  <main class="instance-main" id="instance-main">
    <section class="instance-loading" id="instance-loading">
      <span class="network-overline">Empi Network · Instancia</span>
      <h1 id="instance-name">Cargando…</h1>
      <p id="instance-description"></p>
    </section>
    <div class="instance-builder-content hidden" id="instance-builder-content"></div>
  </main>
  <div class="instance-search hidden" id="instance-search">
    <label for="instance-search-input">Buscar</label>
    <input id="instance-search-input" type="search" autocomplete="off" />
    <button id="instance-search-close" type="button" aria-label="Cerrar">×</button>
    <div class="instance-search-results" id="instance-search-results"><p>Escribe para buscar únicamente dentro de esta instancia.</p></div>
  </div>
  <div class="network-toast" id="network-toast" role="status" aria-live="polite"></div>
  <script src="js/vendor/supabase.js"></script>
  <script type="module" src="js/network/site.js?v=20260729-5"></script>
</body>
</html>
